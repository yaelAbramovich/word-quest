<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Word Quest">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=15">
  <title>Word Quest</title>
</head>
<body>
<main class="app">
  <header>
    <div class="logo">WQ</div>
    <div class="hd"><h1>Word Quest</h1><p>אוצר מילים בכיף</p></div>
    <div class="mini">
      <button id="mute" class="mute" aria-label="השתקה">🔊</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="crossword">🧩<span>תשבץ</span></button>
    <button data-tab="wordsearch">🔎<span>תפזורת</span></button>
    <button data-tab="hangman">🪢<span>איש תלוי</span></button>
    <button data-tab="quiz">🧠<span>חידון</span></button>
    <button data-tab="addwords">📋<span>מילים</span></button>
  </nav>

  <section class="card" id="view"></section>

  <button id="reset" class="reset">איפוס התקדמות</button>
</main>

<script src="words.js?v=15"></script>
<script src="common.js?v=15"></script>
<script src="quiz.js?v=15"></script>
<script src="crossword.js?v=15"></script>
<script src="wordsearch.js?v=15"></script>
<script src="hangman.js?v=15"></script>
<script src="addwords.js?v=15"></script>
</body>
</html>
