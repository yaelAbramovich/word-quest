<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Word Quest">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Word Quest</title>
</head>
<body>
<main class="app">
  <header>
    <div class="logo">WQ</div>
    <div>
      <h1>Word Quest</h1>
      <p>אוצר מילים דרך משמעות, הקשר וזיכרון</p>
    </div>
  </header>

  <section class="stats">
    <div><span>⭐</span><strong id="score">0</strong><small>נקודות</small></div>
    <div><span>🔥</span><strong id="streak">0</strong><small>רצף</small></div>
    <div><span>📚</span><strong id="learned">0</strong><small>מילים</small></div>
  </section>

  <nav class="modes">
    <button class="mode active" data-mode="meaning">🧠 משמעות</button>
    <button class="mode" data-mode="context">📖 הקשר</button>
    <button class="mode" data-mode="reverse">🎯 שליפה</button>
    <button class="mode" data-mode="listen">🔊 האזנה</button>
  </nav>

  <section class="card" id="game"></section>

  <section class="progress-card">
    <div class="progress-title"><b>התקדמות במילים</b><span id="progressText">0 / 0</span></div>
    <div class="progress"><div id="progressBar"></div></div>
    <p>💡 מילים שטעית בהן יחזרו יותר פעמים במשחק.</p>
  </section>

  <button id="reset" class="reset">איפוס התקדמות</button>
</main>

<script src="app.js"></script>
</body>
</html>
